name: ImmersiveReader

options:
  bundleIdPrefix: com.wallaceguo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Synchronized folders: Xcode picks up added or removed files without regenerating the project.
  defaultSourceDirectoryType: syncedFolder

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1

targets:
  ImmersiveReader:
    type: application
    platform: iOS
    sources:
      - path: ImmersiveReader
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: SwiftSoup
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallaceguo.ImmersiveReader
        PRODUCT_NAME: ImmersiveReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 沉浸阅读
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - ImmersiveReaderTests
      gatherCoverageData: true

  ImmersiveReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImmersiveReaderTests
    dependencies:
      - target: ImmersiveReader
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallaceguo.ImmersiveReaderTests
        GENERATE_INFOPLIST_FILE: YES
